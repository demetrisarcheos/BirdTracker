# Builds an unsigned BirdTracker.ipa on a GitHub-hosted Mac.
# Download it from the run's "Artifacts" section and install it with Sideloadly (Windows),
# which signs it with your Apple ID.
name: Build iOS app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached Core ML model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: BirdTracker/Models/yolo26n.mlpackage
          key: yolo26n-coreml-${{ hashFiles('scripts/export_yolo26.py') }}

      - name: Restore cached species model
        id: species-cache
        uses: actions/cache@v4
        with:
          path: BirdTracker/Models/BirdSpecies.mlpackage
          key: species-coreml-${{ hashFiles('scripts/export_species.py') }}

      - uses: actions/setup-python@v5
        if: steps.model-cache.outputs.cache-hit != 'true' || steps.species-cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"

      - name: Export species classifier to Core ML
        if: steps.species-cache.outputs.cache-hit != 'true'
        run: |
          set +e
          { pip install -U transformers "torch==2.7.*" coremltools "numpy<2.0" && python scripts/export_species.py; } > species.log 2>&1
          code=$?
          cat species.log
          if [ $code -ne 0 ]; then
            msg=$(tr -d '\r' < species.log | grep -v '^[[:space:]]*$' | tail -15 | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Species export failed::$msg"
            exit $code
          fi

      - name: Export YOLO26 to Core ML
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set +e
          { pip install -U ultralytics coremltools "numpy<2.0" && python scripts/export_yolo26.py; } > export.log 2>&1
          code=$?
          cat export.log
          if [ $code -ne 0 ]; then
            # Post the tail of the log as an annotation (readable without signing in).
            msg=$(tr -d '\r' < export.log | grep -v '^[[:space:]]*$' | tail -15 | cut -c1-240 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Model export failed::$msg"
            exit $code
          fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project BirdTracker.xcodeproj \
            -scheme BirdTracker \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*BirdTracker|BUILD (SUCCEEDED|FAILED)" || true
          if [ ! -d build/Build/Products/Release-iphoneos/BirdTracker.app ]; then
            msg=$( (grep -E "error:" xcodebuild.log || tail -40 xcodebuild.log) | sed 's#.*/BirdTracker/BirdTracker/##' | sort -u | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Xcode build failed::$msg"
            exit 1
          fi

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BirdTracker.app Payload/
          zip -qry BirdTracker.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BirdTracker-ipa
          path: BirdTracker.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
