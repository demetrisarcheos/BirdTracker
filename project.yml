# Generate the Xcode project on a Mac with:  brew install xcodegen && xcodegen generate
name: BirdTracker
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your Apple team ID (or pick it in Xcode › Signing)
targets:
  BirdTracker:
    type: application
    platform: iOS
    scheme: {}                    # shared scheme so xcodebuild -scheme works in CI
    sources:
      - path: BirdTracker
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.birdtracker
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Bird Tracker
    info:
      path: BirdTracker/Info.plist
      properties:
        CFBundleDisplayName: Bird Tracker
        NSCameraUsageDescription: Bird Tracker uses the camera to detect birds and measure their distance, speed and flight direction.
        NSMotionUsageDescription: Bird Tracker uses motion sensors and the compass to turn on-screen movement into real flight direction.
        NSBluetoothAlwaysUsageDescription: Bird Tracker connects to the motion sensor on your gun and can switch on your GoPro's Wi-Fi.
        NSLocalNetworkUsageDescription: Bird Tracker receives live video from your GoPro over its Wi-Fi network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64, still-camera, magnetometer]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarHidden: true
